<!DOCTYPE html>

<head>

    <title>G.R.J. Vitale</title>
    <style>
        body {
            /* Font accademico con grazie */
            font-family: "Georgia", "Times New Roman", serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            /* Sfondo scuro (quasi nero) e testo grigio chiaro */
            background-color: #222; 
            color: #bbb;
        }

        /* Titoli chiari e non in grassetto */
        h1, h2 { 
            font-weight: normal; 
            color: #eee; 
            margin-top: 2.5rem;
        }
        
        h1 { margin-top: 0; } /* Rimuove spazio sopra il nome */

        /* Link chiari e sottolineati */
        a { 
            color: #eee; 
            text-decoration: underline; 
        }
        
        a:hover { 
            color: #fff; 
            text-decoration: none;
        }

        /* Stile del menu di navigazione */
        nav { margin-bottom: 4rem; }
        nav a { 
            margin-right: 20px; 
            text-decoration: none; /* Niente sottolineatura nel menu */
            font-size: 1.1rem;
        }
        nav a:hover { text-decoration: underline; }

        /* Footer per il copyright */
        .footer {
            margin-top: 5rem;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
