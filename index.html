<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.J. Vitale</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body {
            /* 2. SFONDO VERDE FORESTA */
            background-color: #1a3c34; 
            color: #d8d8d8; /* Testo grigio perla */
            font-family: "Inter", sans-serif; /* Font pulito per la lettura */
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Contenitore per centrare il tutto mantenendo i margini laterali */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 3. LAYOUT HEADER: Nome a sinistra, Menu a destra */
        header {
            display: flex;
            justify-content: space-between; /* Spinge gli elementi agli estremi */
            align-items: baseline; /* Allinea il testo sulla riga di base */
            margin-bottom: 80px;
            padding-top: 20px;
            flex-wrap: wrap; /* Permette di andare a capo su schermi piccoli */
        }

        /* 4. IL NOME GIGANTE E STILIZZATO */
        h1 {
            font-family: "Playfair Display", serif;
            font-size: 5rem; /* Molto grande */
            margin: 0;
            line-height: 0.9;
            color: #0e221d; /* Verde scurissimo (effetto incassato) */
            text-transform: uppercase;
            letter-spacing: -2px; /* Lettere vicine per eleganza */
        }

        /* Stile del Menu */
        nav {
            display: flex;
            gap: 30px; /* Spazio tra i link */
        }

        nav a {
            color: #aebdb8; /* Colore verde/grigio chiaro */
            text-decoration: none;
            font-size: 1.4rem;
            font-family: "Playfair Display", serif; /* Anche il menu usa il font elegante */
        }

        nav a:hover {
            color: #fff; /* Diventa bianco al passaggio del mouse */
        }

        /* Stile dei contenuti (About, Contact) */
        main {
            max-width: 700px; /* Limita la larghezza del testo per leggibilità */
        }

        h2 {
            font-family: "Inter", sans-serif;
            font-size: 1rem;
            color: #8fa39e; /* Verde salvia per i titoletti */
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 3rem;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.1rem;
            margin-top: 0;
            color: #e0e0e0;
        }

        /* Link dentro al testo (es. email) */
        p a, p i {
            color: #fff;
            font-style: italic;
        }

        .footer {
            margin-top: 6rem;
            font-size: 0.85rem;
            color: #5c756f;
        }

        /* Adattamento per cellulari */
        @media (max-width: 700px) {
            header { flex-direction: column; gap: 20px; }
            h1 { font-size: 3.5rem; }
            nav { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header>
            <h1>G.R.J.<br>Vitale</h1>
            
            <nav>
                <a href="#">Home</a>
                <a href="#">Math</a>
                <a href="mailto:grj.vitale@gmail.com">Contact</a>
            </nav>
        </header>

        <main>
            <h2>About me</h2>
            <p>
                Undergraduate student in Mathematics.
            </p>

            <h2>Contact</h2>
            <p>
                Email me at <i>grj.vitale@</i> followed by <i>gmail.com</i>.
            </p>
        </main>

        <div class="footer">
            © 2026 G.R.J. Vitale
        </div>

    </div>

</body>
</html>
